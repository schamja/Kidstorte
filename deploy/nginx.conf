# ─────────────────────────────────────────────────────────────
# nginx — TLS-Termination + Reverse-Proxy zu Kidstorte
# ─────────────────────────────────────────────────────────────
# WICHTIG: ersetze "kidstorte.example.com" durch deine echte Domain!
# ─────────────────────────────────────────────────────────────

# HTTP — leitet alles nach HTTPS um, nur ACME-Challenge bleibt offen
server {
    listen 80;
    listen [::]:80;
    server_name kidstorte.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — die eigentliche App
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kidstorte.example.com;

    # TLS-Zertifikate von Let's Encrypt (siehe Setup-Anleitung in README)
    ssl_certificate     /etc/letsencrypt/live/kidstorte.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidstorte.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload-Limit (Admin-Panel: Referenzbild-Upload)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/kidstorte.access.log;
    error_log  /var/log/nginx/kidstorte.error.log;

    location / {
        proxy_pass http://kidstorte:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── KRITISCH: SSE (Server-Sent Events) für Streaming-Chat ──
        # Ohne diese 3 Zeilen kommt der Stream erst am Ende oder bricht ab!
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        # WebSocket-Header (falls je benötigt — schadet nicht)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
