# ─────────────────────────────────────────────────────────────
# Prometheus — scrapt Container + Node + nginx-Metriken
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus selbst
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor: Container-Stats (CPU, RAM, Net, Disk pro Container)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Node-Exporter: Host-Stats (CPU, RAM, Load, FS)
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Kidstorte-App (Health-Endpoint)
  # Verwendet blackbox-exporter wenn vorhanden, sonst nur up/down
  - job_name: kidstorte-health
    metrics_path: /api/calendar/status
    scrape_interval: 30s
    static_configs:
      - targets: ['kidstorte:5001']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        target_label: app
        replacement: kidstorte
