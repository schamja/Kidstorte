# ─────────────────────────────────────────────────────────────
# nginx — LOKALES Setup (HTTP only, kein TLS)
# Für Production siehe nginx.conf mit Let's Encrypt
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Upload-Limit (Admin-Panel: Referenzbild-Upload)
    client_max_body_size 10M;

    # Security-Header (auch lokal sinnvoll)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs (im Container-Log sichtbar via docker logs)
    access_log /var/log/nginx/kidstorte.access.log;
    error_log  /var/log/nginx/kidstorte.error.log;

    location / {
        proxy_pass http://kidstorte:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-Polling für Streaming-Endpoints (Chat-Stream)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Statische Dateien direkt von nginx ausliefern (optional, faster)
    location /static/ {
        proxy_pass http://kidstorte:5001/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
