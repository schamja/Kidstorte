# ═══════════════════════════════════════════════════════════════
# Deploy — baut Docker-Image, pusht zu ghcr.io, deployed via SSH
#
# Triggers:
#   - Push auf main                  → automatischer Deploy
#   - Manueller Trigger via UI       → Re-Deploy ohne Code-Änderung
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          Hostname/IP des Servers (z.B. 1.2.3.4)
#   SSH_USER          SSH-User (z.B. deploy)
#   SSH_PRIVATE_KEY   Private Key (ed25519 empfohlen)
#   SSH_PORT          (optional, default 22)
#   DEPLOY_PATH       (optional, default /opt/kidstorte)
# ═══════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Build überspringen (nur Server neu deployen)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # NIE einen laufenden Deploy abbrechen!

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}    # → ghcr.io/schamja/kidstorte-longchain

permissions:
  contents: read
  packages: write              # push zu ghcr.io

jobs:
  # ───────────────────────────────────────────────────────────
  # 1) Image bauen und zu ghcr.io pushen
  # ───────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.skip_build }}
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags + Labels generieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.run_number }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────
  # 2) Deploy: SSH auf Server, pull & restart
  # ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || inputs.skip_build) }}

    steps:
      - name: SSH → Pull & Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/kidstorte' }}"
            cd "$DEPLOY_PATH"

            echo "── Login ghcr.io ─────────────────────────────"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "── Aktuellen Stand vom Repo holen ────────────"
            # docker-compose.yml / nginx.conf etc. müssen aktuell sein
            git fetch origin main
            git reset --hard origin/main

            echo "── KIDSTORTE_IMAGE auf neueste SHA pinnen ────"
            # Wichtig für Rollback-Workflow: jeder Deploy pinnt explizit den SHA-Tag
            # in der .env, damit 'previous' eindeutig auflösbar ist.
            NEW_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
            NEW_IMG="ghcr.io/${{ github.repository }}:$NEW_TAG"
            if grep -q '^KIDSTORTE_IMAGE=' .env 2>/dev/null; then
              sed -i "s|^KIDSTORTE_IMAGE=.*|KIDSTORTE_IMAGE=$NEW_IMG|" .env
            else
              echo "KIDSTORTE_IMAGE=$NEW_IMG" >> .env
            fi

            echo "── Neues Image ziehen ────────────────────────"
            docker compose pull kidstorte

            echo "── Container neu starten ─────────────────────"
            docker compose up -d --no-deps --remove-orphans kidstorte

            echo "── Deploy-Historie aktualisieren ─────────────"
            HISTORY=".deploy-history"
            echo "$(date -u +%FT%TZ) $NEW_TAG deploy by:${{ github.actor }} sha:${{ github.sha }}" >> "$HISTORY"
            tail -50 "$HISTORY" > "$HISTORY.tmp" && mv "$HISTORY.tmp" "$HISTORY"

            echo "── Alte Images aufräumen ─────────────────────"
            docker image prune -f --filter "until=72h"

            echo "── Wait for healthy ──────────────────────────"
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' kidstorte 2>/dev/null || echo "starting")
              echo "  [$i/30] status=$status"
              if [ "$status" = "healthy" ]; then
                echo "✓ Container ist healthy"
                exit 0
              fi
              sleep 5
            done

            echo "✗ Container wurde nicht healthy — Logs:"
            docker compose logs --tail=80 kidstorte
            exit 1

      - name: Smoke-Test (HTTP)
        run: |
          # Falls die Domain als Secret existiert, einmal außen anklopfen
          if [ -n "${{ secrets.PUBLIC_URL }}" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -sk -o /dev/null -w "%{http_code}" "${{ secrets.PUBLIC_URL }}/" || echo "000")
              echo "Try $i: HTTP $code"
              [ "$code" = "200" ] && exit 0
              sleep 4
            done
            echo "✗ Public-URL antwortet nicht mit 200"
            exit 1
          fi
